<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Big Dig</title>
<style>
  :root {
    --yellow: #F5B400;
    --ink: #2B2B2B;
    --card: rgba(255, 255, 255, 0.88);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcecf7; font-family: var(--font); color: var(--ink); }
  canvas { display: block; touch-action: none; }
  #title {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 16px; padding: 8px 20px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); text-align: center;
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  #title h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: 0.5px; }
  #title h1 span { color: var(--yellow); }
  #title p { margin: 2px 0 0; font-size: 14px; opacity: 0.75; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title"><h1>Big <span>Dig</span></h1><p>A day inside a giant mine</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ───────────────────────── Constants (1 unit = 1 metre) ─────────────────────────
const SITE_HALF = 200;          // mine site is 400 × 400 m, centred on the origin
const WORLD_SIZE = 3000;        // surrounding hill terrain
const CELL = 25;                // terrain cell size (site edge lands on a cell line)

const COLORS = {
  laterite:  0xC1592B,
  lateriteLight: 0xCC6B3D,
  hillLight: 0x6DAA5C,
  hillDark:  0x4E8B45,
  skyTop:    0x7FB8E6,
  skyHorizon:0xEEF6FB,
  cloud:     0xFFFFFF,
};

// Small seeded random so the world looks the same on every load
function makeRandom(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = makeRandom(7);

const smoothstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

// ───────────────────────── Renderer, scene, camera ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(COLORS.skyHorizon, 900, 2300);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
camera.position.set(260, 230, 330);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;          // pan slides along the ground
controls.minDistance = 30;
controls.maxDistance = 700;
controls.maxPolarAngle = Math.PI * 0.45;      // never look up from below the ground
controls.update();

// ───────────────────────── Lights ─────────────────────────
const hemi = new THREE.HemisphereLight(0xd8ecff, COLORS.hillDark, 1.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(180, 320, 140);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -280, right: 280, top: 280, bottom: -280, near: 10, far: 900 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.5;
scene.add(sun, sun.target);

// ───────────────────────── Sky (gradient dome) ─────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top:     { value: new THREE.Color(COLORS.skyTop) },
    horizon: { value: new THREE.Color(COLORS.skyHorizon) },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 horizon; varying vec3 vDir;
    void main() {
      float h = clamp(vDir.y, 0.0, 1.0);
      gl_FragColor = vec4(mix(horizon, top, pow(h, 0.55)), 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 24, 12), skyMat);
sky.renderOrder = -1;
scene.add(sky);

// ───────────────────────── Ground: hills + site ─────────────────────────
// Gentle wavy noise made from a few sine waves (cheap and smooth)
function waves(x, z) {
  return 0.5 * Math.sin(x * 0.0105 + 1.3) * Math.cos(z * 0.0125 - 0.7)
       + 0.3 * Math.sin(x * 0.027 - z * 0.019 + 2.1)
       + 0.2 * Math.sin(z * 0.041 + x * 0.007);
}

// Height of the land: flat (0) on the site, rising into a ring of green hills outside it
function heightAt(x, z) {
  const dx = Math.max(Math.abs(x) - SITE_HALF, 0);
  const dz = Math.max(Math.abs(z) - SITE_HALF, 0);
  const d = Math.hypot(dx, dz);                       // metres outside the site edge
  if (d <= 0) return 0;
  const n = waves(x, z);
  const nearHills = smoothstep(0, 170, d) * (24 + 16 * n);
  const farHills  = smoothstep(250, 800, d) * (40 + 30 * waves(z * 0.6 + 500, x * 0.6));
  return Math.max(nearHills + farHills, 0);
}

// Builds a flat-shaded triangle grid. Each triangle gets one colour from colorAt().
function buildGrid({ size, cell, skipCell, height, colorAt }) {
  const half = size / 2, n = Math.round(size / cell);
  const pos = [], col = [];
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const x0 = -half + i * cell, z0 = -half + j * cell, x1 = x0 + cell, z1 = z0 + cell;
      if (skipCell && skipCell(x0 + cell / 2, z0 + cell / 2)) continue;
      const tris = [
        [[x0, z0], [x0, z1], [x1, z1]],
        [[x0, z0], [x1, z1], [x1, z0]],
      ];
      for (const tri of tris) {
        let cx = 0, cy = 0, cz = 0;
        for (const [x, z] of tri) {
          const y = height(x, z);
          pos.push(x, y, z);
          cx += x / 3; cy += y / 3; cz += z / 3;
        }
        colorAt(c, cx, cy, cz);
        for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();   // non-indexed → crisp flat facets
  return geo;
}

const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });

// Surrounding hills (a ring of terrain with the site square cut out)
const hillLight = new THREE.Color(COLORS.hillLight);
const hillDark = new THREE.Color(COLORS.hillDark);
const laterite = new THREE.Color(COLORS.laterite);
const hills = new THREE.Mesh(
  buildGrid({
    size: WORLD_SIZE, cell: CELL,
    skipCell: (x, z) => Math.abs(x) < SITE_HALF && Math.abs(z) < SITE_HALF,
    height: heightAt,
    colorAt(c, x, y, z) {
      c.copy(hillLight).lerp(hillDark, clamp(0.5 + 0.5 * waves(z * 1.7, x * 1.7) + (rand() - 0.5) * 0.35, 0, 1));
      // a thin band of red soil where the site meets the grass
      const d = Math.hypot(Math.max(Math.abs(x) - SITE_HALF, 0), Math.max(Math.abs(z) - SITE_HALF, 0));
      c.lerp(laterite, 1 - smoothstep(5, 40, d));
    },
  }),
  groundMat
);
hills.receiveShadow = true;
hills.castShadow = true;
scene.add(hills);

// The empty mine site: warm reddish laterite soil
const lateriteLight = new THREE.Color(COLORS.lateriteLight);
const site = new THREE.Mesh(
  buildGrid({
    size: SITE_HALF * 2, cell: 20,
    height: () => 0,
    colorAt(c) { c.copy(laterite).lerp(lateriteLight, rand()); },
  }),
  groundMat
);
site.receiveShadow = true;
site.name = 'siteGround';
scene.add(site);

// ───────────────────────── Clouds (one instanced mesh of low-poly puffs) ─────────────────────────
const puffs = [];
for (let k = 0; k < 12; k++) {
  const angle = rand() * Math.PI * 2, r = 350 + rand() * 900;
  const cx = Math.cos(angle) * r, cz = Math.sin(angle) * r, cy = 170 + rand() * 110;
  const count = 3 + Math.floor(rand() * 3);
  for (let p = 0; p < count; p++) {
    puffs.push({
      x: cx + (p - count / 2) * 22 + rand() * 10,
      y: cy + rand() * 8,
      z: cz + (rand() - 0.5) * 20,
      s: 18 + rand() * 16,
    });
  }
}
const clouds = new THREE.InstancedMesh(
  new THREE.IcosahedronGeometry(1, 0),
  new THREE.MeshLambertMaterial({ color: COLORS.cloud, flatShading: true, emissive: 0xffffff, emissiveIntensity: 0.25 }),
  puffs.length
);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
puffs.forEach((p, i) => {
  q.setFromEuler(e.set(rand() * 3, rand() * 3, rand() * 3));
  m.compose(new THREE.Vector3(p.x, p.y, p.z), q, new THREE.Vector3(p.s, p.s * 0.6, p.s * 0.85));
  clouds.setMatrixAt(i, m);
});
scene.add(clouds);

// ───────────────────────── Shape helpers (merge simple shapes into one mesh) ─────────────────────────
// part(): one coloured shape placed in local space. mergeParts(): bake many parts into one geometry.
function part(geo, color, { at = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1] } = {}) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  geo.dispose();
  g.applyMatrix4(new THREE.Matrix4().compose(
    new THREE.Vector3(...at),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)),
    new THREE.Vector3(...scale)
  ));
  return { g, color };
}
function mergeParts(parts) {
  const total = parts.reduce((n, p) => n + p.g.attributes.position.count, 0);
  const pos = new Float32Array(total * 3), col = new Float32Array(total * 3);
  const c = new THREE.Color();
  let o = 0;
  for (const p of parts) {
    const arr = p.g.attributes.position.array, n = arr.length / 3;
    pos.set(arr, o * 3);
    c.set(p.color);
    for (let k = 0; k < n; k++) col.set([c.r, c.g, c.b], (o + k) * 3);
    o += n;
    p.g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();   // non-indexed → flat facets
  return geo;
}

// ───────────────────────── Tropical trees on the hills (one instanced mesh) ─────────────────────────
// Canopy vertices are white so the per-tree instance colour (one of the two greens) shows through;
// the trunk tint multiplies with that green into a dark woody colour.
const TREE_COUNT = 32;
const treeGeo = mergeParts([
  part(new THREE.CylinderGeometry(0.45, 0.7, 7, 6), 0xE8A08A, { at: [0, 3.5, 0] }),
  part(new THREE.IcosahedronGeometry(4.5, 0), 0xffffff, { at: [0, 8.5, 0], scale: [1.3, 0.8, 1.3] }),
  part(new THREE.IcosahedronGeometry(3.4, 0), 0xffffff, { at: [1.6, 11, 0.8], scale: [1.1, 0.8, 1.1] }),
  part(new THREE.IcosahedronGeometry(3.0, 0), 0xffffff, { at: [-1.8, 10.5, -1], scale: [1.1, 0.8, 1.1] }),
]);
const trees = new THREE.InstancedMesh(
  treeGeo,
  new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
  TREE_COUNT
);
for (let i = 0; i < TREE_COUNT; ) {
  const x = (rand() - 0.5) * 1300, z = (rand() - 0.5) * 1300;
  const d = Math.hypot(Math.max(Math.abs(x) - SITE_HALF, 0), Math.max(Math.abs(z) - SITE_HALF, 0));
  if (d < 45 || d > 450) continue;          // hills only: never on the site or its red edge band
  const s = 0.8 + rand() * 0.6;
  q.setFromEuler(e.set(0, rand() * Math.PI * 2, 0));
  m.compose(new THREE.Vector3(x, heightAt(x, z) - 0.8, z), q, new THREE.Vector3(s, s, s));
  trees.setMatrixAt(i, m);
  trees.setColorAt(i, rand() < 0.5 ? hillLight : hillDark);
  i++;
}
trees.castShadow = true;
trees.receiveShadow = true;
scene.add(trees);

// ───────────────────────── Camera limits ─────────────────────────
const prevTarget = new THREE.Vector3();
function limitCamera() {
  // keep the look-at point over the site, moving the camera with it
  prevTarget.copy(controls.target);
  controls.target.x = clamp(controls.target.x, -260, 260);
  controls.target.z = clamp(controls.target.z, -260, 260);
  controls.target.y = clamp(controls.target.y, 0, 30);
  camera.position.add(prevTarget.subVectors(controls.target, prevTarget));
  // never dip into the ground or the hills
  const minY = heightAt(camera.position.x, camera.position.z) + 5;
  if (camera.position.y < minY) camera.position.y = minY;
}

// ───────────────────────── Resize + render loop ─────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  limitCamera();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
