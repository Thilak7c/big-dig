<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Big Dig</title>
<style>
  :root {
    --yellow: #F5B400;
    --ink: #2B2B2B;
    --card: rgba(255, 255, 255, 0.88);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcecf7; font-family: var(--font); color: var(--ink); }
  canvas { display: block; touch-action: none; }
  #title {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 16px; padding: 8px 20px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); text-align: center;
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  #title h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: 0.5px; }
  #title h1 span { color: var(--yellow); }
  #title p { margin: 2px 0 0; font-size: 14px; opacity: 0.75; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title"><h1>Big <span>Dig</span></h1><p>A day inside a giant coal mine</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ───────────────────────── Constants (1 unit = 1 metre) ─────────────────────────
const SITE_HALF = 200;          // mine site is 400 × 400 m, centred on the origin
const WORLD_SIZE = 3000;        // surrounding hill terrain
const CELL = 25;                // hill terrain cell size (site edge lands on a cell line)

const COLORS = {
  surface:   0x4A4A48,   // dusty dark grey: site surface, bench tops and pit floor
  hillLight: 0x6DAA5C,
  hillDark:  0x4E8B45,
  skyTop:    0x7FB8E6,
  skyHorizon:0xEEF6FB,
  cloud:     0xFFFFFF,
  topsoil:   0x5B3A24,
  clay:      0xA0522D,
  sandstone: 0xC8B58F,   // overburden
  coal:      0x1C1C1C,
  floorRock: 0x6E6E6E,
  wasteRock: 0xC8B58F,
  road:      0x5C5C5A,
  lane:      0x7A746A,
  shed:      0x8C8C8C,
  concrete:  0x9A9A9A,
  white:     0xF4F4F4,
  yellow:    0xF5B400,
  steel:     0x7A7A7A,
  dark:      0x2B2B2B,
  glass:     0x5D7A8C,
  padGrey:   0xA8A29A,
};

// The pit: a rounded-rectangle floor with 3 steps (wall 4 m across, bench 16 m wide, 8 m high each).
const PIT = { cx: -20, cz: 0, fx: 44, fz: 34, r: 10 };   // floor centre, half-size and corner radius
const FLOOR_Y = -24;
// [distance outside the floor edge, height]: floor → wall → bench → wall → bench → wall → rim
const PIT_PROFILE = [[0, -24], [4, -16], [20, -16], [24, -8], [40, -8], [44, 0]];
const PIT_BOX = { x0: -140, x1: 100, z0: -100, z1: 100 };  // fine-mesh area around the pit (aligned to 20 m)
const PIT_CELL = 2;

// Layers seen in the walls: the height where each band ENDS (going down from the surface).
// The coal seam fills the whole bottom step and continues under the floor.
const LAYERS = { topsoil: -1.5, clay: -5, sandstone: -16.3, coal: -26 };

// Haul road centre line, from the loading area on the pit floor up the ramp to the junction on the rim.
// The bend at the foot of the ramp is a 32 m-radius arc round (-64, -2), as wide as the pit allows.
const HAUL_ROAD_POINTS = [
  [-16, 18],   // 0: road end on the pit floor, beside the loading pad
  [-44, 29],   // 1: foot of the ramp (the climb starts here)
  [-64, 30], [-80, 25.7], [-91.7, 14], [-96, -2],   // the wide bend
  [-96, -46],
  [-80, -64],
  [60, -64],   // 8: top of the ramp, on the rim
  [88, -64],   // 9: junction — the road splits to the coal yard and the waste dump
];
const RAMP_FOOT_POINT = 1, RAMP_TOP_POINT = 8;

// Simulation speed: machines move at real speeds, sped up by this factor so one Mega Hauler loop
// takes about a minute. Every movement and timer uses it; the speed buttons will multiply it.
const TIME_SCALE = 3.85;
// The two branches start on the trunk just before the junction so the road surfaces join smoothly
const COAL_ROAD_POINTS  = [[70, -64], [88, -64], [106, -72], [121, -88], [132, -104]];
// The waste branch swings south, then climbs a straight 60 m ramp onto the top of the waste dump.
const WASTE_ROAD_POINTS = [[70, -64], [88, -64], [118, -62], [148, -52], [168, -34], [174, -14], [174, -8], [174, 52], [174, 55]];
const ROAD_HW = 15;             // half width of the two-lane haul road (30 m: trucks are 9.2 m wide)
const ROAD_FLAT_HW = 16;        // ground is levelled a little wider than the road surface
const BERM_HEIGHT = 1.5;

const LOADING_PAD = { x: 4, z: 14, w: 22, d: 16 };
const QUEUE_BACK = 40;          // queue sign is ~40 m back along the road from the loading pad
// Coal yard: trucks circle the turning pad, then reverse straight east up to a concrete stop wall and tip
// into a hopper pocket set in the ground. The crusher shed beside it feeds a conveyor to the pile.
const COAL_YARD = { pad: { x: 132, z: -104, r: 18 }, crusher: { x: 162, z: -93 }, pile: { x: 165, z: -138 } };
// Waste dump: a flat-topped dump (crest 48 × 48 m, 7 m high, 8 m wide side slopes) with a 60 m ramp up
// its north side. Trucks turn on top and reverse to a safety berm on the south crest to tip over the edge.
const WASTE_DUMP = { cx: 166, cz: 76, hw: 24, h: 7, slope: 8, rampX: 174, rampZ0: -8 };
const SERVICE_LANE = { cx: 148, cz: -122, r: 46, hw: 3 };  // loop around the coal yard, crosses the coal branch once
const OFFICE = { x: 140, z: 28 };
const WATER_TOWER = { x: 30, z: -94 };

// Small seeded random so the world looks the same on every load
function makeRandom(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = makeRandom(7);
const cloudRand = makeRandom(21);
const treeRand = makeRandom(33);
const soilRand = makeRandom(45);

const smoothstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

// ───────────────────────── Renderer, scene, camera ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(COLORS.skyHorizon, 900, 2300);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
camera.position.set(260, 230, 330);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;          // pan slides along the ground
controls.minDistance = 30;
controls.maxDistance = 700;
controls.maxPolarAngle = Math.PI * 0.45;      // never look up from below the ground
controls.update();

// ───────────────────────── Lights ─────────────────────────
const hemi = new THREE.HemisphereLight(0xd8ecff, COLORS.hillDark, 1.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(180, 320, 140);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -280, right: 280, top: 280, bottom: -280, near: 10, far: 900 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.5;
scene.add(sun, sun.target);

// ───────────────────────── Sky (gradient dome) ─────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top:     { value: new THREE.Color(COLORS.skyTop) },
    horizon: { value: new THREE.Color(COLORS.skyHorizon) },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 horizon; varying vec3 vDir;
    void main() {
      float h = clamp(vDir.y, 0.0, 1.0);
      gl_FragColor = vec4(mix(horizon, top, pow(h, 0.55)), 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 24, 12), skyMat);
sky.renderOrder = -1;
scene.add(sky);

// ───────────────────────── Height functions ─────────────────────────
// Gentle wavy noise made from a few sine waves (cheap and smooth)
function waves(x, z) {
  return 0.5 * Math.sin(x * 0.0105 + 1.3) * Math.cos(z * 0.0125 - 0.7)
       + 0.3 * Math.sin(x * 0.027 - z * 0.019 + 2.1)
       + 0.2 * Math.sin(z * 0.041 + x * 0.007);
}

// Height of the hills: 0 at the site edge, rising into a ring of green hills outside it
function heightAt(x, z) {
  const dx = Math.max(Math.abs(x) - SITE_HALF, 0);
  const dz = Math.max(Math.abs(z) - SITE_HALF, 0);
  const d = Math.hypot(dx, dz);                       // metres outside the site edge
  if (d <= 0) return 0;
  const n = waves(x, z);
  const nearHills = smoothstep(0, 170, d) * (24 + 16 * n);
  const farHills  = smoothstep(250, 800, d) * (40 + 30 * waves(z * 0.6 + 500, x * 0.6));
  return Math.max(nearHills + farHills, 0);
}

// Terraced pit: how far a point is outside the floor's rounded rectangle → height from PIT_PROFILE
function pitProfile(x, z) {
  const lx = Math.abs(x - PIT.cx) - (PIT.fx - PIT.r);
  const lz = Math.abs(z - PIT.cz) - (PIT.fz - PIT.r);
  const s = Math.hypot(Math.max(lx, 0), Math.max(lz, 0)) + Math.min(Math.max(lx, lz), 0) - PIT.r;
  if (s <= 0) return PIT_PROFILE[0][1];
  for (let i = 1; i < PIT_PROFILE.length; i++) {
    const [s1, h1] = PIT_PROFILE[i];
    if (s <= s1) {
      const [s0, h0] = PIT_PROFILE[i - 1];
      return h0 + (h1 - h0) * (s - s0) / (s1 - s0);
    }
  }
  return 0;
}

// ───────────────────────── Haul road path ─────────────────────────
const roadCurve = new THREE.CatmullRomCurve3(
  HAUL_ROAD_POINTS.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
const ROAD_SAMPLES = Math.ceil(roadCurve.getLength() / 2);
const roadPts = roadCurve.getSpacedPoints(ROAD_SAMPLES);
const ROAD_STEP = roadCurve.getLength() / ROAD_SAMPLES;      // ≈ 2 m between samples
const nearestSample = (pts, x, z) => {
  let best = 0, bd = Infinity;
  pts.forEach((p, i) => { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; best = i; } });
  return best;
};
const ROAD_FOOT = nearestSample(roadPts, ...HAUL_ROAD_POINTS[RAMP_FOOT_POINT]);
const ROAD_TOP = nearestSample(roadPts, ...HAUL_ROAD_POINTS[RAMP_TOP_POINT]);
// Flat on the floor, an even slope up the ramp (~9%), flat on the rim
roadPts.forEach((p, i) => {
  p.y = i <= ROAD_FOOT ? FLOOR_Y : i >= ROAD_TOP ? 0 : FLOOR_Y * (ROAD_TOP - i) / (ROAD_TOP - ROAD_FOOT);
});

// Branch roads on the rim (flat, y = 0)
function samplePath(points) {
  const curve = new THREE.CatmullRomCurve3(points.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  return curve.getSpacedPoints(Math.ceil(curve.getLength() / 2));
}
const coalRoadPts = samplePath(COAL_ROAD_POINTS);
const wasteRoadPts = samplePath(WASTE_ROAD_POINTS);

// Waste dump height: a square flat top with sloping sides, plus the access ramp (road-wide, sloped sides)
const DUMP_CREST = {
  x0: WASTE_DUMP.cx - WASTE_DUMP.hw, x1: WASTE_DUMP.cx + WASTE_DUMP.hw,
  z0: WASTE_DUMP.cz - WASTE_DUMP.hw, z1: WASTE_DUMP.cz + WASTE_DUMP.hw,
};
function dumpH(x, z) {
  const { cx, cz, hw, h, slope, rampX, rampZ0 } = WASTE_DUMP;
  const out = Math.max(Math.abs(x - cx), Math.abs(z - cz)) - hw;           // metres outside the crest
  const mesa = h * clamp(1 - out / slope, 0, 1);
  const rampY = h * clamp((z - rampZ0) / (DUMP_CREST.z0 - rampZ0), 0, 1);
  const side = Math.abs(x - rampX) - ROAD_HW;
  const ramp = z < rampZ0 ? 0 : Math.max(rampY - Math.max(side, 0) * h / slope, 0);
  return Math.max(mesa, ramp);
}
wasteRoadPts.forEach((p) => { p.y = dumpH(p.x, p.z); });
const ALL_ROADS = [roadPts, coalRoadPts, wasteRoadPts];
const distToRoads = (x, z) => Math.min(...ALL_ROADS.map((pts) => nearestOnPath(pts, x, z).d));

// Nearest point on a polyline → distance and that point's height
function nearestOnPath(pts, x, z) {
  let bd = Infinity, by = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const abx = b.x - a.x, abz = b.z - a.z;
    const t = clamp(((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz), 0, 1);
    const d = (a.x + abx * t - x) ** 2 + (a.z + abz * t - z) ** 2;
    if (d < bd) { bd = d; by = a.y + (b.y - a.y) * t; }
  }
  return { d: Math.sqrt(bd), y: by };
}

// Left-pointing unit vector (in XZ) of a path at sample i
function leftAt(pts, i, closed = false) {
  const n = pts.length;
  const a = closed ? pts[(i - 1 + n) % n] : pts[Math.max(i - 1, 0)];
  const b = closed ? pts[(i + 1) % n] : pts[Math.min(i + 1, n - 1)];
  const tx = b.x - a.x, tz = b.z - a.z, len = Math.hypot(tx, tz) || 1;
  return { x: tz / len, z: -tx / len, tx: tx / len, tz: tz / len };
}

// Final ground height inside the pit area: terraces, with the ramp cut/filled in at 45° side slopes
function groundH(x, z) {
  const p = pitProfile(x, z);
  const { d, y } = nearestOnPath(roadPts, x, z);
  if (d <= ROAD_FLAT_HW) return y;
  const diff = p - y, over = d - ROAD_FLAT_HW;
  if (over < Math.abs(diff)) return y + Math.sign(diff) * over;
  return p;
}

// Ground height anywhere (used to keep the camera above ground)
function groundAt(x, z) {
  if (x > PIT_BOX.x0 && x < PIT_BOX.x1 && z > PIT_BOX.z0 && z < PIT_BOX.z1) return groundH(x, z);
  return Math.max(heightAt(x, z), dumpH(x, z));
}

// ───────────────────────── Grid builder ─────────────────────────
// Flat-shaded triangle grid over [x0,x1]×[z0,z1]. Each triangle gets one colour from colorAt().
function buildGrid({ x0, x1, z0, z1, cell, skipCell, height, colorAt }) {
  const nx = Math.round((x1 - x0) / cell), nz = Math.round((z1 - z0) / cell);
  const H = new Float32Array((nx + 1) * (nz + 1));            // heights computed once per vertex
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= nz; j++) H[i * (nz + 1) + j] = height(x0 + i * cell, z0 + j * cell);
  const h = (i, j) => H[i * (nz + 1) + j];
  const pos = [], col = [];
  const c = new THREE.Color();
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < nz; j++) {
      const ax = x0 + i * cell, az = z0 + j * cell, bx = ax + cell, bz = az + cell;
      if (skipCell && skipCell(ax + cell / 2, az + cell / 2)) continue;
      const tris = [
        [[ax, az, h(i, j)], [ax, bz, h(i, j + 1)], [bx, bz, h(i + 1, j + 1)]],
        [[ax, az, h(i, j)], [bx, bz, h(i + 1, j + 1)], [bx, az, h(i + 1, j)]],
      ];
      for (const tri of tris) {
        let cx = 0, cy = 0, cz = 0;
        for (const [x, z, y] of tri) { pos.push(x, y, z); cx += x / 3; cy += y / 3; cz += z / 3; }
        colorAt(c, cx, cy, cz);
        for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();   // non-indexed → crisp flat facets
  return geo;
}

// ───────────────────────── Hills ─────────────────────────
const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const hillLight = new THREE.Color(COLORS.hillLight);
const hillDark = new THREE.Color(COLORS.hillDark);
const siteEdge = new THREE.Color(COLORS.surface);   // the grass fades into the site's dusty grey at the edge
const hills = new THREE.Mesh(
  buildGrid({
    x0: -WORLD_SIZE / 2, x1: WORLD_SIZE / 2, z0: -WORLD_SIZE / 2, z1: WORLD_SIZE / 2, cell: CELL,
    skipCell: (x, z) => Math.abs(x) < SITE_HALF && Math.abs(z) < SITE_HALF,
    height: heightAt,
    colorAt(c, x, y, z) {
      c.copy(hillLight).lerp(hillDark, clamp(0.5 + 0.5 * waves(z * 1.7, x * 1.7) + (rand() - 0.5) * 0.35, 0, 1));
      // a thin dusty band where the site meets the grass
      const d = Math.hypot(Math.max(Math.abs(x) - SITE_HALF, 0), Math.max(Math.abs(z) - SITE_HALF, 0));
      c.lerp(siteEdge, 1 - smoothstep(5, 40, d));
    },
  }),
  groundMat
);
hills.receiveShadow = true;
hills.castShadow = true;
scene.add(hills);

// ───────────────────────── Site ground + pit (soil-layer material) ─────────────────────────
// The colour comes from the height of each pixel, so the pit walls show clean horizontal
// stripes like a slice of cake. Flat ground (bench tops, floor) gets a coat of grey dust;
// the coal seam is a little glossy. Vertex colour (grey) only adds light/dark variation.
function makeSoilMaterial() {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, metalness: 0 });
  const uniforms = {
    uDust:    { value: new THREE.Color(COLORS.surface) },
    uTopsoil: { value: new THREE.Color(COLORS.topsoil) },
    uClay:    { value: new THREE.Color(COLORS.clay) },
    uSand:    { value: new THREE.Color(COLORS.sandstone) },
    uCoal:    { value: new THREE.Color(COLORS.coal) },
    uRock:    { value: new THREE.Color(COLORS.floorRock) },
  };
  const f = (v) => v.toFixed(2);
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = 'varying float vWorldY;\nvarying float vUp;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
  vWorldY = (modelMatrix * vec4(transformed, 1.0)).y;
  vUp = normalize(mat3(modelMatrix) * objectNormal).y;`);
    shader.fragmentShader = `
      uniform vec3 uDust, uTopsoil, uClay, uSand, uCoal, uRock;
      varying float vWorldY;
      varying float vUp;
      vec3 soilBand(float y) {
        if (y > -0.6) return uDust;
        if (y > ${f(LAYERS.topsoil)}) return uTopsoil;
        if (y > ${f(LAYERS.clay)}) return uClay;
        if (y > ${f(LAYERS.sandstone)}) return uSand;
        if (y > ${f(LAYERS.coal)}) return uCoal;
        return uRock;
      }
    ` + shader.fragmentShader.replace(
      '#include <color_fragment>',
      // flat ground is dusted grey; steep faces (walls) are a little darker so each step stands out
      `float flatness = smoothstep(0.8, 0.97, vUp);
      diffuseColor.rgb = mix(soilBand(vWorldY), uDust, flatness * 0.55) * vColor.r * mix(0.8, 1.0, smoothstep(0.35, 0.9, vUp));`
    ).replace(
      '#include <roughnessmap_fragment>',
      // the coal seam on the walls has a slight sheen
      `float roughnessFactor = roughness;
      if (vWorldY <= ${f(LAYERS.sandstone)} && vWorldY > ${f(LAYERS.coal)} && vUp < 0.8) roughnessFactor = 0.42;`);
  };
  return mat;
}
const soilMat = makeSoilMaterial();
const soilShade = (c, x, y, z) => c.setScalar(0.94 + 0.05 * waves(x * 2.3, z * 2.3) + (soilRand() - 0.5) * 0.05);

// Flat site ground around the pit (coarse cells)
const site = new THREE.Mesh(
  buildGrid({
    x0: -SITE_HALF, x1: SITE_HALF, z0: -SITE_HALF, z1: SITE_HALF, cell: 20,
    skipCell: (x, z) => x > PIT_BOX.x0 && x < PIT_BOX.x1 && z > PIT_BOX.z0 && z < PIT_BOX.z1,
    height: () => 0,
    colorAt: soilShade,
  }),
  soilMat
);
site.receiveShadow = true;
site.name = 'siteGround';
scene.add(site);

// The pit itself (fine cells): terraces, soil-layer walls and the ramp cut into them
const pit = new THREE.Mesh(
  buildGrid({ ...PIT_BOX, cell: PIT_CELL, height: groundH, colorAt: soilShade }),
  soilMat
);
pit.receiveShadow = true;
pit.castShadow = true;
pit.name = 'pitWalls';
scene.add(pit);

// ───────────────────────── Shape helpers (merge simple shapes into one mesh) ─────────────────────────
// part(): one coloured shape placed in local space. mergeParts(): bake many parts into one geometry.
function part(geo, color, { at = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1] } = {}) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  geo.dispose();
  g.applyMatrix4(new THREE.Matrix4().compose(
    new THREE.Vector3(...at),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)),
    new THREE.Vector3(...scale)
  ));
  return { g, color };
}
function mergeParts(parts) {
  const total = parts.reduce((n, p) => n + p.g.attributes.position.count, 0);
  const pos = new Float32Array(total * 3), col = new Float32Array(total * 3);
  const c = new THREE.Color();
  let o = 0;
  for (const p of parts) {
    const arr = p.g.attributes.position.array, n = arr.length / 3;
    pos.set(arr, o * 3);
    c.set(p.color);
    for (let k = 0; k < n; k++) col.set([c.r, c.g, c.b], (o + k) * 3);
    o += n;
    p.g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();   // non-indexed → flat facets
  return geo;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 8) => new THREE.CylinderGeometry(rt, rb, h, seg);
const propMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });

function addProp(name, parts, x, y, z, rotY = 0) {
  const mesh = new THREE.Mesh(mergeParts(parts), propMat);
  mesh.position.set(x, y, z);
  mesh.rotation.y = rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = name;
  scene.add(mesh);
  return mesh;
}

// ───────────────────────── Roads (flat ribbons laid on the ground) ─────────────────────────
// Ribbon along a path: pts carry their own height; lift keeps it just above the ground.
function buildRibbon(pts, hw, lift, closed = false) {
  const pos = [];
  const n = pts.length, segs = closed ? n : n - 1;
  const edge = (i) => {
    const p = pts[i % n], L = leftAt(pts, i % n, closed);
    return [[p.x + L.x * hw, p.y + lift, p.z + L.z * hw], [p.x - L.x * hw, p.y + lift, p.z - L.z * hw]];
  };
  for (let i = 0; i < segs; i++) {
    const [a0, b0] = edge(i), [a1, b1] = edge(i + 1);
    pos.push(...a0, ...b0, ...b1, ...a0, ...b1, ...a1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}
const flatMat = (color, offset) => new THREE.MeshLambertMaterial({
  color, flatShading: true, polygonOffset: true, polygonOffsetFactor: -offset, polygonOffsetUnits: -4 * offset,
});
const roadMat = flatMat(COLORS.road, 1);
const laneMat = flatMat(COLORS.lane, 2);

// Haul road: pit floor → ramp → rim → junction, then one branch to each destination
for (const [name, pts] of [['haulRoad', roadPts], ['coalRoad', coalRoadPts], ['wasteRoad', wasteRoadPts]]) {
  const road = new THREE.Mesh(buildRibbon(pts, ROAD_HW, 0.12), roadMat);
  road.receiveShadow = true;
  road.name = name;
  scene.add(road);
}

// Turning pad at the end of the coal branch (the waste branch ends on top of the dump)
for (const [name, pad] of [['coalPad', COAL_YARD.pad]]) {
  const disc = new THREE.Mesh(new THREE.CircleGeometry(pad.r, 24).rotateX(-Math.PI / 2), roadMat);
  disc.position.set(pad.x, 0.12, pad.z);
  disc.receiveShadow = true;
  disc.name = name;
  scene.add(disc);
}

// Berms: low dirt banks along the outer (drop-off) edge of the ramp
{
  const pos = [];
  let prev = null;
  for (let i = ROAD_FOOT; i <= ROAD_TOP; i++) {
    const p = roadPts[i], L = leftAt(roadPts, i);
    const probe = ROAD_HW + 5;
    const gl = groundH(p.x + L.x * probe, p.z + L.z * probe);
    const gr = groundH(p.x - L.x * probe, p.z - L.z * probe);
    const side = gl < gr ? 1 : -1;
    let cur = null;
    if (Math.min(gl, gr) < p.y - BERM_HEIGHT) {
      const at = (off, up) => [p.x + L.x * side * off, p.y + up, p.z + L.z * side * off];
      // berm sits on the road's outer 2.5 m, so 26 m of the 30 m road stays usable
      cur = { side, inner: at(ROAD_HW - 2, 0), top: at(ROAD_HW - 0.75, BERM_HEIGHT), outer: at(ROAD_HW + 0.5, 0) };
    }
    if (cur && prev && prev.side === cur.side) {
      pos.push(...prev.inner, ...prev.top, ...cur.top, ...prev.inner, ...cur.top, ...cur.inner);
      pos.push(...prev.top, ...prev.outer, ...cur.outer, ...prev.top, ...cur.outer, ...cur.top);
    }
    prev = cur;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const berms = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: COLORS.wasteRock, flatShading: true, side: THREE.DoubleSide }));
  berms.castShadow = true;
  berms.receiveShadow = true;
  berms.name = 'berms';
  scene.add(berms);
}

// Service lane: a narrow loop around the coal yard for the small pickup.
// The pickup will drive it in increasing-index order; it crosses the coal branch of the haul road once.
const lanePts = [];
for (let k = 0; k < 144; k++) {
  const a = (k / 144) * Math.PI * 2;
  lanePts.push(new THREE.Vector3(SERVICE_LANE.cx + Math.cos(a) * SERVICE_LANE.r, 0, SERVICE_LANE.cz + Math.sin(a) * SERVICE_LANE.r));
}

serviceLane.receiveShadow = true;
serviceLane.name = 'serviceLane';
scene.add(serviceLane);

// The crossing is the lane point closest to a haul road. The pickup must stop at the last point

const laneRoadDist = lanePts.map((p) => distToRoads(p.x, p.z));

const SIGN_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
function canvasTexture(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function makeSign(name, { width, height, post, texture }, x, z, faceX, faceZ) {
  const group = new THREE.Group();
  const back = new THREE.MeshLambertMaterial({ color: 0x9a9a9a });
  const front = new THREE.MeshLambertMaterial({ map: texture, emissive: 0xffffff, emissiveMap: texture, emissiveIntensity: 0.35 });
  const pole = new THREE.Mesh(cyl(0.1, 0.1, post + height * 0.9, 6), new THREE.MeshLambertMaterial({ color: COLORS.steel }));
  pole.position.y = (post + height * 0.9) / 2;
  const board = new THREE.Mesh(box(width, height, 0.12), [back, back, back, back, front, back]);
  board.position.set(0, post + height / 2, 0.12);
  pole.castShadow = board.castShadow = true;
  group.add(pole, board);
  group.position.set(x, groundAt(x, z), z);
  group.rotation.y = Math.atan2(faceX, faceZ);      // board front (+z) faces this direction
  group.name = name;
  scene.add(group);
  return group;
}

// ───────────────────────── Coal yard: crusher shed, conveyor, coal stockpile ─────────────────────────
// A cone of radius 1 and height 1 (base at y = 0) with its rings nudged in and out so it looks lumpy.
// Matching positions get the same nudge, so the surface stays closed.
function lumpyCone(radial, rows, seed) {
  const g = new THREE.ConeGeometry(1, 1, radial, rows).translate(0, 0.5, 0);
  const pos = g.attributes.position, r = makeRandom(seed), nudge = new Map();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (y > 0.99) continue;                                   // keep the tip
    const key = `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;
    if (!nudge.has(key)) nudge.set(key, 1 + (r() - 0.5) * 0.24);
    const k = nudge.get(key), base = y < 0.001;
    pos.setXYZ(i, x * k, base ? 0 : y * (1 + (k - 1) * 0.6), z * k);
  }
  const flat = g.toNonIndexed();
  flat.computeVertexNormals();
  return flat;
}

// Crusher shed with a hopper pocket set in the ground on its west side. Trucks reverse up to the
// concrete stop wall (the "safety berm" of a tipping point) and tip over it into the pocket.
addProp('crusherShed', [
  part(box(10, 8, 8), COLORS.shed, { at: [0, 4, 0] }),
  part(box(10.6, 0.4, 8.6), COLORS.steel, { at: [0, 8.2, 0] }),
  part(box(0.1, 3, 2.6), COLORS.dark, { at: [5.05, 1.5, 2] }),                        // door
  part(box(7.4, 0.3, 9), COLORS.concrete, { at: [-8, 0.15, 0] }),                     // pocket collar
  part(box(5.6, 0.06, 6.6), COLORS.dark, { at: [-8, 0.32, 0] }),                      // pocket opening
  part(box(1, 1.2, 10), COLORS.concrete, { at: [-12, 0.6, 0] }),                      // stop wall
  part(box(0.12, 0.3, 10.02), COLORS.yellow, { at: [-12.5, 0.95, 0] }),               // yellow stripe facing the trucks
  part(box(10, 0.12, 12), COLORS.concrete, { at: [-17.5, 0.08, 0] }),                 // tipping apron
], COAL_YARD.crusher.x, 0, COAL_YARD.crusher.z);

// Coal stockpile: a lumpy black cone (starts small; it will grow in a later stage)
const coalPile = new THREE.Mesh(lumpyCone(11, 4, 5),
  new THREE.MeshStandardMaterial({ color: COLORS.coal, flatShading: true, roughness: 0.5, metalness: 0 }));
coalPile.position.set(COAL_YARD.pile.x, 0, COAL_YARD.pile.z);
coalPile.scale.set(8, 5.5, 8);
coalPile.castShadow = coalPile.receiveShadow = true;
coalPile.name = 'coalPile';
scene.add(coalPile);

// Sloped conveyor from the top of the crusher shed to above the pile, on two support legs
{
  const start = new THREE.Vector3(COAL_YARD.crusher.x + 3, 7.4, COAL_YARD.crusher.z - 4.5);
  const end = new THREE.Vector3(COAL_YARD.pile.x, 14, COAL_YARD.pile.z);
  const len = start.distanceTo(end);

  conveyor.name = 'conveyor';
  conveyor.position.copy(start).lerp(end, 0.5);
  conveyor.lookAt(end);                                    // local +z now runs up the conveyor
  conveyor.add(partsMesh('conveyorBelt', [
    part(box(2.2, 0.7, len), COLORS.steel),

  ]));
  scene.add(conveyor);
  const legs = [];
  for (const t of [0.3, 0.55]) {
    const p = start.clone().lerp(end, t), h = p.y - 0.4;
    legs.push(part(box(0.5, h, 0.5), COLORS.steel, { at: [p.x, h / 2, p.z] }));
  }

}

// ───────────────────────── Waste dump: flat top, sloping sides, access ramp, crest berm ─────────────────────────
{
  const wasteMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 });
  const rock = new THREE.Color(COLORS.wasteRock), dust = new THREE.Color(COLORS.surface);
  const shade = makeRandom(57);
  const dump = new THREE.Mesh(buildGrid({
    x0: 130, x1: 200, z0: -10, z1: 110, cell: 2,
    skipCell: (x, z) => [-1, 1].every((dx) => [-1, 1].every((dz) => dumpH(x + dx, z + dz) <= 0)),
    height: dumpH,
    // beige dumped rock, a little dusty on the flat top
    colorAt: (c, x, y) => c.copy(rock).lerp(dust, y > WASTE_DUMP.h - 0.01 ? 0.25 : 0).multiplyScalar(0.92 + shade() * 0.1),
  }), wasteMat);
  dump.castShadow = dump.receiveShadow = true;
  dump.name = 'wasteDump';
  scene.add(dump);

  // Safety berm (1.5 m) round the crest, with a gap where the ramp arrives
  const B = { in: 3.5, top: 2, out: 0.5, h: 1.5 }, y = WASTE_DUMP.h, { x0, x1, z0, z1 } = DUMP_CREST;
  const gap = [WASTE_DUMP.rampX - ROAD_HW - 1, WASTE_DUMP.rampX + ROAD_HW + 1];
  const pos = [];
  // one straight berm from a to b; (nx, nz) points outward over the edge
  const berm = (ax, az, bx, bz, nx, nz) => {
    const at = (x, z, off, up) => [x + nx * off, y + up, z + nz * off];
    const sec = (x, z) => [at(x, z, -B.in, 0), at(x, z, -B.top, B.h), at(x, z, -B.out, 0)];
    const [a0, a1, a2] = sec(ax, az), [b0, b1, b2] = sec(bx, bz);
    pos.push(...a0, ...a1, ...b1, ...a0, ...b1, ...b0, ...a1, ...a2, ...b2, ...a1, ...b2, ...b1);
    pos.push(...a0, ...a2, ...a1, ...b0, ...b1, ...b2);                                  // end caps
  };
  berm(x0, z1, x1, z1, 0, 1);            // south crest: the tip head
  berm(x0, z0, x0, z1, -1, 0);           // west
  berm(x1, z0, x1, z1, 1, 0);            // east
  berm(x0, z0, gap[0], z0, 0, -1);       // north, either side of the ramp
  berm(gap[1], z0, x1, z0, 0, -1);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const crestBerm = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xB8A47E, flatShading: true, side: THREE.DoubleSide }));
  crestBerm.castShadow = crestBerm.receiveShadow = true;
  crestBerm.name = 'dumpBerm';
  scene.add(crestBerm);
}

// ───────────────────────── Machines (Stage 3: built at real size, parked, not moving) ─────────────────────────
// Every machine is a Group whose local +x is "forward". Moving parts are child Groups/Meshes with names,
// so later stages can animate them: digger.upperBody/boom/stick/bucket, hauler.body + wheels,
// waterTruck.sprayBar + wheels, pickup.flag/flagLight + wheels, spotter.flagArm.
const MACHINE_COLORS = {
  vest: 0xFF7A1A, flag: 0xFF7A1A, reflect: 0xDDDDDD, skin: 0xB07A55,
  trousers: 0x3B4A5A, shirt: 0x34506E, counterweight: 0xD9A000, light: 0xFFB000,
};

function partsMesh(name, parts, material = propMat) {
  const mesh = new THREE.Mesh(mergeParts(parts), material);
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
// Pivot group at a point; children are built relative to it.
function pivot(name, x, y, z) {
  const g = new THREE.Group();
  g.name = name;
  g.position.set(x, y, z);
  return g;
}
// A wheel spins around its local z axis (the axle), so later stages just change wheel.rotation.z
function makeWheel(name, radius, width, x, y, z, hubColor = COLORS.steel) {
  const w = partsMesh(name, [
    part(cyl(radius, radius, width, 14), COLORS.dark, { rot: [Math.PI / 2, 0, 0] }),
    part(cyl(radius * 0.5, radius * 0.5, width + 0.04, 8), hubColor, { rot: [Math.PI / 2, 0, 0] }),
  ]);
  w.position.set(x, y, z);
  return w;
}
// Stand a machine on the ground facing a heading (hx, hz)
function placeMachine(obj, x, z, hx, hz) {
  obj.position.set(x, groundAt(x, z), z);
  obj.rotation.y = Math.atan2(-hz, hx);
  scene.add(obj);
}

// ── Big Digger: tracks, rotating upper body, boom + stick + bucket, raised cab (~8 m), counterweight ──
function makeDigger() {
  const Y = COLORS.yellow, D = COLORS.dark, S = COLORS.steel;
  const digger = new THREE.Group();
  digger.name = 'bigDigger';

  const under = [];
  for (const s of [-1, 1]) {
    under.push(part(box(7.0, 1.8, 1.4), D, { at: [0, 0.9, s * 2.7] }));
    under.push(part(cyl(0.9, 0.9, 1.4, 10), D, { at: [3.5, 0.9, s * 2.7], rot: [Math.PI / 2, 0, 0] }));

// ── Mega Hauler: 14.5 m long, 9.2 m wide, cab top ~6.5 m; huge tyres, canopy, front staircase, tipping body ──
function makeMegaHauler(name) {
  const Y = COLORS.yellow, D = COLORS.dark, S = COLORS.steel, G = COLORS.glass;
  const truck = new THREE.Group();
  truck.name = name;

  const chassis = [
    part(box(11.5, 1.2, 2.6), D, { at: [-0.5, 2.3, 0] }),                 // main frame
    part(box(2.2, 3.0, 3.6), Y, { at: [4.9, 3.0, 0] }),                   // engine housing (set back so the stairs fit)
    part(box(0.12, 2.2, 2.6), D, { at: [6.05, 3.1, 0] }),                 // radiator grille
    part(box(1.2, 0.8, 4.0), Y, { at: [6.6, 1.4, 0] }),                   // front bumper
    part(box(3.8, 0.35, 9.2), Y, { at: [5.3, 4.7, 0] }),                  // upper deck
    part(box(2.8, 1.65, 3.0), Y, { at: [5.2, 5.7, -2.9] }),               // cab on the left, top ≈ 6.5 m
    part(box(0.08, 0.9, 2.6), G, { at: [6.62, 5.9, -2.9] }),
    part(box(2.2, 0.9, 0.08), G, { at: [5.2, 5.9, -4.42] }),
    part(box(0.08, 0.9, 5.6), Y, { at: [7.15, 5.35, 1.6] }),              // deck handrail
    part(box(2.8, 1.4, 1.4), Y, { at: [0, 2.3, -2.6] }),                  // fuel tank
    part(box(2.8, 1.4, 1.4), Y, { at: [0, 2.3, 2.6] }),                   // hydraulic tank
    part(box(0.8, 1.2, 1.0), D, { at: [-6.4, 3.4, 1.0] }),                // body hinge brackets
    part(box(0.8, 1.2, 1.0), D, { at: [-6.4, 3.4, -1.0] }),
  ];
  // Diagonal staircase across the front: low on the right, up to the deck near the cab
  const stairLow = [3.6, 0.7], stairHigh = [-0.6, 4.5], steps = 9;
  const stairLen = Math.hypot(stairLow[0] - stairHigh[0], stairHigh[1] - stairLow[1]);
  const stairTilt = Math.atan2(stairHigh[1] - stairLow[1], stairLow[0] - stairHigh[0]);
  const midZ = (stairLow[0] + stairHigh[0]) / 2, midY = (stairLow[1] + stairHigh[1]) / 2;
  for (let k = 0; k <= steps; k++) {
    const t = k / steps;
    chassis.push(part(box(0.7, 0.12, 0.6), S, { at: [6.8, stairLow[1] + (stairHigh[1] - stairLow[1]) * t, stairLow[0] + (stairHigh[0] - stairLow[0]) * t] }));
  }
  chassis.push(part(box(0.1, 0.25, stairLen), Y, { at: [6.4, midY, midZ], rot: [stairTilt, 0, 0] }));
  chassis.push(part(box(0.1, 0.25, stairLen), Y, { at: [7.2, midY, midZ], rot: [stairTilt, 0, 0] }));
  chassis.push(part(box(0.08, 0.08, stairLen), Y, { at: [7.2, midY + 1.0, midZ], rot: [stairTilt, 0, 0] }));   // handrail
  truck.add(partsMesh('chassis', chassis));

  // Tyres (~4 m tall, taller than a person): single at the front, doubles at the back
  const wheels = [];
  for (const s of [-1, 1]) {
    wheels.push(makeWheel(s < 0 ? 'wheelFL' : 'wheelFR', 2.0, 1.4, 3.6, 2.0, s * 3.85, Y));
    wheels.push(makeWheel(s < 0 ? 'wheelRLo' : 'wheelRRo', 2.0, 1.4, -3.6, 2.0, s * 3.85, Y));
    wheels.push(makeWheel(s < 0 ? 'wheelRLi' : 'wheelRRi', 2.0, 1.4, -3.6, 2.0, s * 2.35, Y));
  }
  wheels.forEach((w) => truck.add(w));

  // Tipping body: pivots at the rear hinge (rotation.z > 0 lifts the front)
  const HINGE = [-6.4, 3.9];
  const body = pivot('body', HINGE[0], HINGE[1], 0);
  const at = (x, y, z) => [x - HINGE[0], y - HINGE[1], z];
  const bodyParts = [
    part(box(11.4, 0.4, 8.8), Y, { at: at(-1.5, 4.3, 0) }),               // floor
    part(box(11.4, 2.8, 0.3), Y, { at: at(-1.5, 5.9, 4.3) }),             // side walls
    part(box(11.4, 2.8, 0.3), Y, { at: at(-1.5, 5.9, -4.3) }),
    part(box(0.35, 2.8, 8.8), Y, { at: at(4.0, 5.9, 0) }),                // front wall
    part(box(3.2, 0.3, 8.8), Y, { at: at(5.6, 7.45, 0) }),                // canopy over the cab
  ];
  for (const x of [-5, -2.5, 0, 2.5]) {                                    // side ribs
    bodyParts.push(part(box(0.35, 2.8, 0.2), Y, { at: at(x, 5.9, 4.5) }));
    bodyParts.push(part(box(0.35, 2.8, 0.2), Y, { at: at(x, 5.9, -4.5) }));
  }
  body.add(partsMesh('bodyShell', bodyParts));
  truck.add(body);
  truck.userData = { kind: 'megaHauler', body, wheels };
  return truck;
}

// ───────────────────────── Mega Hauler route (one truck, empty loop) ─────────────────────────
// The loop is split into legs that each end in a stop: pad → up to the waste dump → back down →
// turn on the pit floor → back onto the pad. Trucks keep left, 6.5 m from the road centre line.
const LANE_OFF = 6.5;        // truck edge ≈ 11.1 m out: 1.9 m clear of the berm; 3.8 m between two passing trucks
const V_CRUISE = 9, V_SLOPE = 6, V_REV = 2.5;      // m/s ≈ 32, 22 and 9 km/h
const A_LAT = 1.5, ACC = 1.0, DEC = 1.2;           // gentle turns, starts and stops (m/s²)
const lerp = THREE.MathUtils.lerp;
const angleDiff = (a, b) => ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;   // shortest turn from a to b
const lerpAngle = (a, b, t) => a + angleDiff(a, b) * t;

// Lane centre points of a road from sample `from` to `to` (left of the travel direction).
// Smoothed a little so the inside lane of a tight bend still has a truck-sized turning circle.
function lanePoints(pts, from, to, every = 2) {
  const dir = Math.sign(to - from);
  let lane = [];
  for (let i = from; ; i += dir) {
    const L = leftAt(pts, i);
    lane.push([pts[i].x + dir * L.x * LANE_OFF, pts[i].z + dir * L.z * LANE_OFF]);
    if (i === to) break;
  }
  for (let pass = 0; pass < 12; pass++) {
    lane = lane.map((p, i) => (i === 0 || i === lane.length - 1) ? p
      : [(lane[i - 1][0] + 2 * p[0] + lane[i + 1][0]) / 4, (lane[i - 1][1] + 2 * p[1] + lane[i + 1][1]) / 4]);
  }
  return lane.filter((_, i) => i % every === 0 || i === lane.length - 1);
}

const onLoadingPad = (x, z) => Math.abs(x - LOADING_PAD.x) < LOADING_PAD.w / 2 && Math.abs(z - LOADING_PAD.z) < LOADING_PAD.d / 2;

// One leg: smooth curve sampled every ~1 m with height, heading, tilt and a speed limit per sample.
// `before` / `after` are the neighbouring points just outside the leg; they set its heading at each end
// (by default the curve carries straight on), so the truck never snaps round at a stop.
function makeLeg(name, ctrl, { reverse = false, pause = 0, before, after } = {}) {
  const mirror = (p, q) => [2 * p[0] - q[0], 2 * p[1] - q[1]];
  const all = [before ?? mirror(ctrl[0], ctrl[1]), ...ctrl, after ?? mirror(ctrl.at(-1), ctrl.at(-2))];
  const full = new THREE.CatmullRomCurve3(all.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  const dense = full.getSpacedPoints(Math.ceil(full.getLength() * 4));
  const near = ([x, z]) => nearestSample(dense, x, z);
  const inner = dense.slice(near(ctrl[0]), near(ctrl.at(-1)) + 1);   // drop the parts beyond the end points
  const curve = new THREE.CatmullRomCurve3(inner, false, 'centripetal');
  const len = curve.getLength(), n = Math.max(2, Math.round(len)), step = len / n;
  const pts = curve.getSpacedPoints(n);
  const y = pts.map((p) => groundAt(p.x, p.z) + (onLoadingPad(p.x, p.z) ? 0.2 : 0.12));
  const at = (i) => clamp(i, 0, n);
  const yaw = [], pitch = [], height = [], vmax = [];
  pts.forEach((p, i) => {
    const k = Math.max(Math.min(2, i, n - i), 1);                      // centred window, shorter near the ends
    const a = pts[at(i - k)], b = pts[at(i + k)], sign = reverse ? -1 : 1;
    yaw.push(Math.atan2(-(b.z - a.z) * sign, (b.x - a.x) * sign));
    // wheels about 4 m ahead of and behind the middle set the tilt and the height
    const iF = at(i + 4 * sign), iB = at(i - 4 * sign);
    pitch.push(Math.atan2(y[iF] - y[iB], Math.max(Math.abs(iF - iB) * step, step)));
    height.push((y[iF] + y[iB]) / 2);
    // slow down for tight bends and slopes
    const c = pts[at(i - 3)], d = pts[at(i + 3)];
    const turn = Math.abs(angleDiff(Math.atan2(p.z - c.z, p.x - c.x), Math.atan2(d.z - p.z, d.x - p.x)));
    const radius = turn > 1e-4 ? (c.distanceTo(p) + p.distanceTo(d)) / turn : Infinity;
    let v = Math.min(V_CRUISE, Math.sqrt(A_LAT * radius));
    if (Math.abs(y[at(i + 3)] - y[at(i - 3)]) > 6 * step * 0.03) v = Math.min(v, V_SLOPE);
    vmax.push(reverse ? V_REV : v);
  });
  // brake smoothly to a stop at the end of the leg
  vmax[n] = 0.4;
  for (let i = n - 1; i >= 0; i--) vmax[i] = Math.min(vmax[i], Math.sqrt(vmax[i + 1] ** 2 + 2 * DEC * step));
  return { name, pts, len, n, step, yaw, pitch, height, vmax, reverse, pause };
}

// Points along a circle round (cx, cz), from angle a0 to a1 (x = cx + R cos a, z = cz + R sin a)
const arcPoints = (cx, cz, R, a0, a1, n = 16) =>
  Array.from({ length: n + 1 }, (_, k) => { const a = lerp(a0, a1, k / n); return [cx + R * Math.cos(a), cz + R * Math.sin(a)]; });

// S-bend of two equal arcs from (x0, z0) to (x1, z1), heading north (−z) at both ends, with x1 > x0
function sBendNorth(x0, z0, x1, z1) {
  const th = 2 * Math.atan((x1 - x0) / (z0 - z1)), R = (z0 - z1) / (2 * Math.sin(th));
  return [...arcPoints(x0 + R, z0, R, Math.PI, Math.PI + th, 8), ...arcPoints(x1 - R, z1, R, th, 0, 8).slice(1)];
}

const HAUL_JUNCTION = nearestSample(roadPts, ...WASTE_ROAD_POINTS[0]);   // where the waste branch leaves the trunk
const DUMP_RAMP_TOP = nearestSample(wasteRoadPts, WASTE_DUMP.rampX, DUMP_CREST.z0);
// On the dump top: drive in, swing round a 14 m-radius half circle, stop facing north, then reverse
// south up to the crest berm. The rear wheels stop ~2 m short of the berm; the body overhangs toward it.
const DUMP_TURN = { cx: WASTE_DUMP.rampX - 7.5, cz: DUMP_CREST.z0 + 10, R: 14 };
const DUMP_TIP = { x: DUMP_TURN.cx - DUMP_TURN.R, z: DUMP_CREST.z1 - 11.5 };

const haulRoute = [
  // 1. off the pad, up the pit ramp, along the waste branch and up the dump ramp, round the half circle on top
  makeLeg('toDumpTop', [
    [4, 14], [-0.1, 14.3], [-4.3, 15.3], [-12.4, 18.7], [-20.4, 23.3], [-28.4, 28.2], [-36.4, 32.6],   // ~14 m-radius S onto the lane
    ...lanePoints(roadPts, 16, HAUL_JUNCTION),
    ...lanePoints(wasteRoadPts, 4, DUMP_RAMP_TOP),
    [DUMP_TURN.cx + DUMP_TURN.R, DUMP_TURN.cz - 5],
    ...arcPoints(DUMP_TURN.cx, DUMP_TURN.cz, DUMP_TURN.R, 0, Math.PI),
  ], { pause: 1, before: [12, 14], after: [DUMP_TIP.x, DUMP_TURN.cz - 6] }),
  // 2. reverse straight south to the crest berm (the body tips over the edge here from Stage 5)
  makeLeg('toCrest', [
    [DUMP_TIP.x, DUMP_TURN.cz], [DUMP_TIP.x, DUMP_TIP.z],
  ], { reverse: true, pause: 3 }),
  // 3. forward off the dump, down both ramps, then a 16 m-radius left turn on the pit floor
  makeLeg('toPit', [
    ...sBendNorth(DUMP_TIP.x, DUMP_TIP.z, WASTE_DUMP.rampX - LANE_OFF, wasteRoadPts[DUMP_RAMP_TOP].z),   // ~25 m-radius S
    ...lanePoints(wasteRoadPts, DUMP_RAMP_TOP - 2, 4),
    ...lanePoints(roadPts, HAUL_JUNCTION, 8),
    ...arcPoints(-39, 3, 16, 1.05, 0, 8),
    [-23, -16],
  ], { pause: 1.5 }),
  // 4. back in a 27 m-radius curve onto the loading pad, stopping facing the road (body toward the digger)
  makeLeg('ontoPad', [
    [-23, -16], ...arcPoints(4, -13, 27, Math.PI, Math.PI / 2),
  ], { reverse: true, pause: 4, after: [10, 14] }),   // (loading happens here from Stage 5)
];

// Drive state: where the truck is on its route
const truck1 = haulers[0];
truck1.rotation.order = 'YZX';     // turn (y) after tilting along its length (z)
const drive = { leg: haulRoute.length - 1, s: haulRoute.at(-1).len, v: 0, wait: 2, blend: 0, from: null };

function poseOnLeg(obj, leg, s) {
  const f = clamp(s / leg.step, 0, leg.n), i = Math.min(Math.floor(f), leg.n - 1), t = f - i;
  const a = leg.pts[i], b = leg.pts[i + 1];
  obj.position.set(lerp(a.x, b.x, t), lerp(leg.height[i], leg.height[i + 1], t), lerp(a.z, b.z, t));
  obj.rotation.y = lerpAngle(leg.yaw[i], leg.yaw[i + 1], t);
  obj.rotation.z = lerp(leg.pitch[i], leg.pitch[i + 1], t);
}

function updateHauler(dt) {
  const d = drive;
  if (d.wait > 0) {
    d.wait -= dt;
    if (d.wait <= 0) {
      d.leg = (d.leg + 1) % haulRoute.length; d.s = 0; d.v = 0;
      // ease out of any small mismatch between where one leg ends and the next begins
      d.from = { x: truck1.position.x, z: truck1.position.z, yaw: truck1.rotation.y }; d.blend = 1;
    }
  } else {
    const leg = haulRoute[d.leg], i = Math.min(Math.round(d.s / leg.step), leg.n);
    d.v = Math.max(Math.min(d.v + ACC * dt, leg.vmax[i]), 0.3);
    const ds = Math.min(d.v * dt, leg.len - d.s);
    d.s += ds;
    truck1.userData.wheels.forEach((w) => { w.rotation.z -= (leg.reverse ? -ds : ds) / 2.0; });
    if (d.s >= leg.len) d.wait = leg.pause;
  }
  poseOnLeg(truck1, haulRoute[d.leg], d.s);
  if (d.blend > 0) {
    d.blend = Math.max(d.blend - dt, 0);
    const t = d.blend * d.blend;
    truck1.position.x = lerp(truck1.position.x, d.from.x, t);
    truck1.position.z = lerp(truck1.position.z, d.from.z, t);
    truck1.rotation.y = lerpAngle(truck1.rotation.y, d.from.yaw, t);
  }
}
updateHauler(0);

// ───────────────────────── Clouds (one instanced mesh of low-poly puffs) ─────────────────────────
const puffs = [];
for (let k = 0; k < 12; k++) {
  const angle = cloudRand() * Math.PI * 2, r = 350 + cloudRand() * 900;
  const cx = Math.cos(angle) * r, cz = Math.sin(angle) * r, cy = 170 + cloudRand() * 110;
  const count = 3 + Math.floor(cloudRand() * 3);
  for (let p = 0; p < count; p++) {
    puffs.push({
      x: cx + (p - count / 2) * 22 + cloudRand() * 10,
      y: cy + cloudRand() * 8,
      z: cz + (cloudRand() - 0.5) * 20,
      s: 18 + cloudRand() * 16,
    });
  }
}
const clouds = new THREE.InstancedMesh(
  new THREE.IcosahedronGeometry(1, 0),
  new THREE.MeshLambertMaterial({ color: COLORS.cloud, flatShading: true, emissive: 0xffffff, emissiveIntensity: 0.25 }),
  puffs.length
);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
puffs.forEach((p, i) => {
  q.setFromEuler(e.set(cloudRand() * 3, cloudRand() * 3, cloudRand() * 3));
  m.compose(new THREE.Vector3(p.x, p.y, p.z), q, new THREE.Vector3(p.s, p.s * 0.6, p.s * 0.85));
  clouds.setMatrixAt(i, m);
});
scene.add(clouds);

// ───────────────────────── Tropical trees on the hills (one instanced mesh) ─────────────────────────
// Canopy vertices are white so the per-tree instance colour (one of the two greens) shows through;
// the trunk tint multiplies with that green into a dark woody colour.
const TREE_COUNT = 32;
const treeGeo = mergeParts([
  part(new THREE.CylinderGeometry(0.45, 0.7, 7, 6), 0xE8A08A, { at: [0, 3.5, 0] }),
  part(new THREE.IcosahedronGeometry(4.5, 0), 0xffffff, { at: [0, 8.5, 0], scale: [1.3, 0.8, 1.3] }),
  part(new THREE.IcosahedronGeometry(3.4, 0), 0xffffff, { at: [1.6, 11, 0.8], scale: [1.1, 0.8, 1.1] }),
  part(new THREE.IcosahedronGeometry(3.0, 0), 0xffffff, { at: [-1.8, 10.5, -1], scale: [1.1, 0.8, 1.1] }),
]);
const trees = new THREE.InstancedMesh(
  treeGeo,
  new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
  TREE_COUNT
);
for (let i = 0; i < TREE_COUNT; ) {
  const x = (treeRand() - 0.5) * 1300, z = (treeRand() - 0.5) * 1300;
  const d = Math.hypot(Math.max(Math.abs(x) - SITE_HALF, 0), Math.max(Math.abs(z) - SITE_HALF, 0));
  if (d < 45 || d > 450) continue;          // hills only: never on the site or its red edge band
  const s = 0.8 + treeRand() * 0.6;
  q.setFromEuler(e.set(0, treeRand() * Math.PI * 2, 0));
  m.compose(new THREE.Vector3(x, heightAt(x, z) - 0.8, z), q, new THREE.Vector3(s, s, s));
  trees.setMatrixAt(i, m);
  trees.setColorAt(i, treeRand() < 0.5 ? hillLight : hillDark);
  i++;
}
trees.castShadow = true;
trees.receiveShadow = true;
scene.add(trees);

// ───────────────────────── Camera limits ─────────────────────────
const prevTarget = new THREE.Vector3();
function limitCamera() {
  // keep the look-at point over the site, moving the camera with it
  prevTarget.copy(controls.target);
  controls.target.x = clamp(controls.target.x, -260, 260);
  controls.target.z = clamp(controls.target.z, -260, 260);
  controls.target.y = clamp(controls.target.y, FLOOR_Y, 30);
  camera.position.add(prevTarget.subVectors(controls.target, prevTarget));
  // never dip into the ground, the pit walls or the hills
  const minY = groundAt(camera.position.x, camera.position.z) + 5;
  if (camera.position.y < minY) camera.position.y = minY;
}

// ───────────────────────── Resize + render loop ─────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1) * TIME_SCALE;     // no big jumps after a hidden tab
  updateHauler(dt);
  controls.update();
  limitCamera();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
